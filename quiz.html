<!doctype html>

<body>

<header class="masthead">
  <div class="masthead-inner">
    <a href="index.html" style="color:inherit;text-decoration:none"><span class="wordmark">Politeia</span></a>
    <span class="wordmark-greek">πολιτεία</span>
    <span class="label" id="star-count" style="display:none"></span>
  </div>
</header>

<main>
  <div class="progress">
    <div class="label" id="progress-text">0 answered</div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0"></div></div>
  </div>

  <div id="stage"></div>

  <div style="display:flex;gap:var(--s3);margin-top:var(--s7)">
    <button class="btn btn-ghost" id="back" type="button">Back</button>
    <button class="btn" id="next" type="button" disabled>Next</button>
  </div>

  <p class="small" style="margin-top:var(--s6)">
    Answer as you actually think, not as you think the statement is coded. Nothing here
    is scored as correct. <b>“No view”</b> is not the same as <b>Neutral</b> — use it when
    you genuinely have no position, and the item will be excluded rather than counted as
    a zero.
  </p>
</main>

<script type="module" src="js/app.js"></script>
