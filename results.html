<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Politeia — result</title>
<meta name="description" content="A Politeia result: five value axes, a temperament reading, an admixture of political traditions, and the tensions between your own commitments.">
<!-- noindex: a result URL carries a specific person's answers in its fragment. Even
     though fragments are never sent to a server, these pages should not accumulate in
     search results. The landing page is the one meant to be found. -->
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Politeia">
<meta property="og:title" content="A Politeia result">
<meta property="og:description" content="Five value axes, a temperament reading, an admixture of traditions, and the contradictions between one person's own commitments.">
<meta name="twitter:card" content="summary">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <a href="index.html" style="color:inherit;text-decoration:none"><span class="wordmark">Politeia</span></a>
    <span class="wordmark-greek">πολιτεία</span>
    <span class="label">computed in your browser</span>
  </div>
</header>

<main id="out">
  <!-- Replaced by js/results.js on success. If it is still here, the module never ran —
       which must never look like an empty page. -->
  <div class="narrow" id="boot-fallback">
    <h1>Loading your result…</h1>
    <p class="small">Everything is computed in your browser, so this needs a little
    JavaScript to finish. If this message stays put, something failed to load.</p>
  </div>
</main>

<footer>
  Politeia · <a href="index.html">About</a> · <a href="quiz.html">Retake</a> ·
  this page made no network requests
</footer>

<script type="module">
// Loaded through a dynamic import rather than src= so that a failure is catchable.
// The results page pulls a deep module graph — the item bank, the 91-anchor corpus
// across its era files, families, and the engine — and on a slow or flaky connection
// one of those can drop. A blank page with no explanation is the worst possible
// outcome, so: retry once, then say plainly what happened.
const show = (html) => { document.getElementById('out').innerHTML = html; };

try {
  await import('./js/results.js');
} catch (first) {
  try {
    await new Promise((r) => setTimeout(r, 400));
    await import('./js/results.js?retry=1');
  } catch (second) {
    show(`<div class="narrow">
      <h1>Could not load</h1>
      <p>Part of this page failed to download, so your result could not be computed.
      Your answers are safe — they are held in the address bar, not on a server, so
      reloading will try again with nothing lost.</p>
      <p style="margin-top:var(--s6)">
        <button class="btn" onclick="location.reload()">Reload</button>
      </p>
      <p class="small" style="margin-top:var(--s6)">If it keeps failing:
      <code>${String(second).slice(0, 160).replace(/</g, '&lt;')}</code></p>
    </div>`);
  }
}
</script>
</body>
</html>
